[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic/versions", "tests"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = "alembic/versions"
