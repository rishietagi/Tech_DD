[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic/versions", "tests"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# openpyxl ships no type stubs. Only the response importer touches it, and that module's
# own signatures stay fully typed and checked.
[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

# python-pptx ships no type stubs under `strict`.
[[tool.mypy.overrides]]
module = "pptx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.services.scope.export_pptx"
disallow_untyped_calls = false

# xlsxwriter is likewise stub-less under `strict`.
[[tool.mypy.overrides]]
module = "xlsxwriter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.services.irl.export_xlsx"
disallow_untyped_calls = false

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = "alembic/versions"
