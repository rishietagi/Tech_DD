# The final report — structure, routing and wording. docs/reference/REPORT_STRUCTURE.md.
#
# Practitioner-editable, validated at startup. The builder (services/report/builder.py)
# decides nothing about wording that is not here: it routes findings to areas, picks the
# highest severity, and fills these templates. Investment impact is always "XXX" for the
# engagement team (Rishi, 2026-11-18).

version: "1.0"

cover:
  title: IT Due Diligence
  subtitle: Draft Report

dd_labels:
  enterprise: Enterprise IT Due Diligence
  product: Product Technology Due Diligence
  blended: Technology Due Diligence (product and enterprise)

# Executive summary title by DD type, as the sample titles its table.
executive_titles:
  enterprise: Technology & Cyber Due Diligence
  product: Product Technology Due Diligence
  blended: Technology Due Diligence

context:
  objective: >-
    {investor} has requested KPMG to perform {dd_label} on the target ({target}).
  objective_no_investor: >-
    KPMG has been engaged to perform {dd_label} on the target ({target}).
  approach: >-
    As part of the IT due diligence, KPMG has relied on the information provided by the
    target's management{sessions}. Relevant limitations with respect to data availability
    are highlighted in the respective sections of the report.
  sessions:
    "Full (data room and management sessions)": " and sessions with key management personnel"
    "Management sessions only": " and sessions with key management personnel"
  outcome: >-
    This report highlights the key gaps in the target's {areas}.
  outcome_no_findings: >-
    This report sets out the scope of the review across the target's {areas}, and the
    information still outstanding; no findings have yet been recorded.
  cutoff: >-
    The technology assessment is based on the information received from the target up to
    {date}.

# The diligence areas the executive summary is organised by (Phase 8, Rishi 2026-11-18).
# Every gap theme names one of these ids (reference/estate/*.yaml); a finding is grouped
# under its area, areas appear in this order, and findings within an area by severity. A
# finding whose area is not listed here is still reported, under its own name — a finding
# is never dropped. `workstreams` tie an area to the scope, for the "not assessed" claim.
areas:
  - {id: process_enablement, title: Business Process Enablement, workstreams: [W-APP, W-PROC]}
  - {id: applications, title: IT Applications, workstreams: [W-APP]}
  - {id: infrastructure, title: IT Infrastructure, workstreams: [W-INFRA]}
  - {id: cyber, title: Cyber Security, workstreams: [W-SEC]}
  - {id: data, title: Data Governance and Privacy, workstreams: [W-DATA]}
  - {id: organisation, title: IT Organisation, workstreams: [W-OPS]}
  - {id: governance, title: IT Governance, workstreams: [W-OPS, W-PROC]}
  - {id: strategy, title: IT Strategy and Roadmap, workstreams: [W-STRAT]}
  - {id: pmo, title: Project Delivery (PMO), workstreams: [W-STRAT]}
  - {id: budget, title: IT Budgeting, workstreams: [W-SPEND]}
  - {id: contracts, title: IT Contracts and Vendors, workstreams: [W-VEN]}
  - {id: engineering, title: Software Engineering Practice, workstreams: [W-PROD, W-PROC]}
  - {id: ai, title: AI Implementation, workstreams: [W-DATA]}

max_findings_per_area: 5
# Evidence bullets under one finding; the rest stay in the assessment's register.
max_bullets_per_finding: 3

# A business process scored Manual or Emerging is a finding of its own, as in the sample.
process_finding:
  area: process_enablement
  headline: "{process} cycle is not automated"
  bullet: >-
    {process} scores {index}/100 ({band}) on the automation assessment: the work is largely
    done by hand around the systems.
  implication: >-
    The process depends on manual effort, so headcount scales with volume and errors and
    control gaps follow.
  action: >-
    Target should prioritise automation of {process}, starting with the highest-volume
    manual steps, using the capability already in its systems where it exists.
  impact: [plan_risk, run_cost]
  # Bands that raise it, and the severity of each.
  bands: {manual: High, emerging: Medium}

no_findings: No material gaps were identified on the information received.
not_assessed: Not assessed — the information needed was not received (see Data limitations).

limitations:
  requests: "{missing} of {total} requests in this area have not been received{examples}."
  partial: "Provided in part: {request}."
  follow_up: "Open follow-up: {question}"
  inventory_application: Details of {count} application(s) were not provided ({fields}).
  inventory_platform: Lifecycle and support status of {count} platform(s) were not provided.
  no_applications: An application inventory has not been provided.
  no_platforms: An infrastructure inventory has not been provided.
  no_team: Details of the IT organisation — roles, reporting lines and the in-house versus outsourced mix — were not provided.
  no_contracts: A list of IT contracts and licences, with terms and expiry, was not provided.
  no_projects: A list of in-flight and planned IT projects, with budgets and progress, was not provided.
  no_cyber_tools: The cyber tools inventory was not completed, so security tooling is unconfirmed.
  no_budget: IT budget and actual spend for the review period were not provided.
  unknown_checks: "The status of {count} control(s) could not be established: {checks}."
  no_network_diagram: A network or infrastructure architecture diagram was not provided.

# Which inventory and assessment gaps are data limitations of which workstream.
limitation_routing:
  inventory_application: W-APP
  no_applications: W-APP
  inventory_platform: W-INFRA
  no_platforms: W-INFRA
  no_network_diagram: W-INFRA
  no_team: W-OPS
  no_contracts: W-VEN
  no_projects: W-STRAT
  no_cyber_tools: W-SEC
  no_budget: W-SPEND
  unknown_checks: W-INFRA

# Supporting analysis: which sections, in which order, per DD type. Each id is a section
# builder in services/report/sections.py; the title and side-panel lead-in live here.
supporting:
  enterprise: [applications, landscape, infrastructure, cyber, data, organisation, strategy, budget, processes, ai]
  product: [architecture, engineering, product_security, organisation, data_ai, strategy, budget, business_systems]
  # blended: product sections first when the mix is product-weighted (>= 50), else enterprise.

sections:
  applications: {title: IT Applications}
  landscape: {title: Overview of Current IT Landscape}
  infrastructure: {title: IT Infrastructure}
  cyber: {title: Cyber Security}
  data: {title: Data Governance and Privacy}
  organisation: {title: IT Organisation and Governance}
  strategy: {title: IT Strategy and Project Portfolio}
  ai: {title: AI Adoption}
  budget: {title: IT Governance and Budgeting}
  processes: {title: Business Process Automation}
  architecture: {title: Architecture and Platforms}
  engineering: {title: Engineering Practice}
  product_security: {title: Product Security}
  data_ai: {title: Data and AI Capability}
  business_systems: {title: Business Systems}

appendix: [applications, team, contracts, projects, platforms, data_domains, cyber_tools, diagrams]

appendix_titles:
  applications: IT Applications
  team: IT Team
  contracts: IT Contracts
  projects: IT Projects
  platforms: Infrastructure Platforms
  cyber_tools: Cyber Security Tools
  data_domains: Data Domains
  diagrams: Network and Infrastructure Diagrams

source_line: As per information provided by target

