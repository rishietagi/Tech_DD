# Application assessment — docs/reference/DD_ASSESSMENT_FRAMEWORK.md §3.
#
# Phase 8 (Rishi, 2026-11-18): a due diligence is not an enterprise-architecture review.
# There is no fit score, no fit quadrant and no disposition per application. Three things
# are asked per application — how critical it is, how automated the work in it is, and how
# far AI is used — and four questions about the portfolio as a whole. Everything else comes
# from the facts the target supplied in the inventory.
#
# What the rules find about individual applications are observations. They are reported
# only through the themes at the bottom of this file, each one a finding a deal team acts
# on. Thresholds are [EXT]: calibrations to tune, not authorities.

version: "2.0"

questions:
  - id: criticality
    group: criticality
    text: Business criticality
    help: What stops if this application is unavailable for a day?
    scale: [1, 5]
    levels:
      1: Peripheral — an outage is an inconvenience.
      2: Supporting — a workaround covers a day without it.
      3: Important — an outage disrupts a function within the day.
      4: Critical — an outage stops a core process.
      5: Mission-critical — an outage stops revenue or breaches an obligation.

  - id: automation
    group: automation
    text: Automation of the work it supports
    help: >-
      The same ladder as the business processes, so an application's level and a
      process's level mean the same thing.
    scale: [0, 5]
    levels:
      0: Manual — the work happens outside the system; it records nothing.
      1: Recorded — the outcome is keyed in after the fact.
      2: Standardised — the work is done in the system; people move it between steps.
      3: Integrated — data flows in and out without re-keying; people still handle steps.
      4: Automated — the system executes routine cases; people handle exceptions.
      5: Optimised — touchless for the routine, with exceptions measured and falling.

  - id: ai
    group: ai
    text: AI level
    help: How far AI is actually used in the work, not what the licence includes.
    scale: [0, 5]
    levels:
      0: None.
      1: Available, unused — AI features are licensed or offered but switched off.
      2: Piloted — trials or isolated use, outside the daily workflow.
      3: In production — predictions, classifications or recommendations used daily.
      4: AI-led with oversight — routine decisions taken by AI, exceptions reviewed, models monitored.
      5: Agentic — AI agents act across steps within defined guardrails, with an audit trail.

# Asked once, about the portfolio — the questions a deal team asks of an application
# landscape [DD_master §6.6, p. 75].
portfolio_sections:
  - key: landscape
    label: Application landscape
    source: DD_master §6.6, p. 75

portfolio_questions:
  - id: AQ1
    section: landscape
    text: Can the core platform (ERP or equivalent) carry the plan through the hold?
    help: Version, support status, customisation and scalability, judged together.
    source: '"What version of each application is in use … What is the level of customization?" [DD_master p. 75]'
    theme: core_platform
    options:
      - label: Yes — current, supported, and scales with the plan
        value: 1.0
      - label: With an upgrade that is planned and funded
        value: 0.6
        finding: The core platform needs an upgrade to carry the plan; the upgrade is planned and funded.
        severity: Low
      - label: Needs an upgrade or re-implementation that is not yet planned or funded
        value: 0.2
        finding: The core platform needs an upgrade or re-implementation to carry the plan, and none is planned or funded.
        severity: High
      - label: There is no core platform — functions run on separate tools
        value: 0.0
        finding: There is no core platform; functions run on separate tools that the plan will have to consolidate.
        severity: High

  - id: AQ2
    section: landscape
    text: How are the core systems integrated?
    help: Finance, sales, operations, HR — how data moves between them.
    source: '"What system interfaces and dependencies are in place, and how complex are they?" [DD_master p. 75]'
    theme: integration
    options:
      - label: Through governed APIs or an integration layer
        value: 1.0
      - label: Point-to-point interfaces
        value: 0.6
        finding: Core systems are linked by point-to-point interfaces, which multiply the cost of every change.
        severity: Low
      - label: File transfers and scheduled batches
        value: 0.3
        finding: Core systems exchange data by file transfer and batch, so information lags between functions.
        severity: Medium
      - label: Data is re-keyed between systems
        value: 0.0
        finding: Data is re-keyed by hand between core systems, increasing the risk of errors and inefficiencies.
        severity: High

  - id: AQ3
    section: landscape
    text: How is management reporting produced?
    source: '"Data inconsistencies from manual entry" is a common finding [DD_master p. 75].'
    theme: analytics
    options:
      - label: From one enterprise analytics platform with agreed KPIs
        value: 1.0
      - label: Departmental reporting tools, KPIs defined separately
        value: 0.5
        finding: KPIs are tracked independently by departments, so there is no single view of performance.
        severity: Medium
      - label: Assembled in spreadsheets
        value: 0.0
        finding: Management reporting is assembled by hand in spreadsheets.
        severity: High

  - id: AQ4
    section: landscape
    text: Who owns the applications?
    source: '"Complex application suites" and duplication are common findings [DD_master p. 75].'
    theme: fragmentation
    options:
      - label: Centrally, with a named owner for each application
        value: 1.0
      - label: Centrally, without named owners
        value: 0.6
        finding: Applications have no named owners, so no one is accountable for their fitness or cost.
        severity: Low
      - label: Decentralised — business units choose and run their own
        value: 0.2
        finding: Ownership of platforms is decentralised across business units, which drives duplication.
        severity: Medium
      - label: Unclear
        value: 0.0
        finding: Ownership of applications is unclear.
        severity: Medium

rules:
  critical_min: 4
  manual_automation_max: 1
  # A business process whose latest score falls in one of these bands, while in-scope
  # applications claim to support it, is the licence-versus-use gap.
  weak_process_bands: [manual, emerging]
  # The inventory type that is not licensed capability.
  ad_hoc_type: Spreadsheet or ad hoc tool
  eol_lifecycles: [End of life within 24 months]
  high_customisation: [High]
  manual_integration: [Manual re-keying]
  weak_dr: [None, Backup only]
  # Categories too broad to mean "two of the same thing".
  duplication_exempt_categories:
    - Other
    - Industry-specific
    - Custom line-of-business
    - Integration and middleware
  analytics_category: Business intelligence and analytics
  # Mean AI level at or below this, across at least ai_min_answered applications, means
  # AI use is limited to what is switched on in the box.
  ai_low_max: 1.0
  ai_min_answered: 3

# The findings this assessment can report. `area` is a diligence area in
# reference/report/report.yaml. The severity rule is the same everywhere:
#   High   — threatens continuity of a critical operation, regulatory exposure, or an
#            unfunded investment the plan depends on;
#   Medium — constrains the plan or adds cost;
#   Low    — an improvement.
themes:
  - id: end_of_support
    area: applications
    headline: Critical applications facing end-of-support risks
    implication: >-
      Applications approaching end of vendor support will need upgrading or replacing
      inside the hold, an investment not yet in the plan, and carry security and stability
      risk until then.
    impact: [one_off_investment, continuity]
    action: >-
      Target should prioritise upgrading or replacing {subjects} before vendor support ends,
      and renew the licences needed to avoid disruption to business operations.
    severity: Medium

  - id: core_platform
    area: applications
    headline: Core platform requires upgrade to support the plan
    implication: >-
      The core platform cannot carry the plan as it stands; the upgrade or re-implementation
      is a material one-off investment and a dependency for the value-creation plan.
    impact: [one_off_investment, plan_risk]
    action: >-
      Target should define and fund a core platform roadmap — upgrade or re-implementation —
      with a business case, timeline and budget.
    severity: High

  - id: fragmentation
    area: applications
    headline: Fragmented application landscape with functional overlaps
    implication: >-
      Overlapping applications split data and effort and add licence and support cost;
      rationalising them is a cost and a dependency for any integration.
    impact: [run_cost, integration]
    action: >-
      Target should develop an application portfolio rationalisation approach to identify
      consolidation opportunities and reduce functional overlaps, starting with {subjects}.
    severity: Medium

  - id: customisation
    area: applications
    headline: Heavy customisation constraining upgrades
    implication: >-
      Heavily customised core applications are costly and slow to upgrade, which raises the
      cost of every future change and of any move to a standard platform.
    impact: [one_off_investment, run_cost]
    action: >-
      Target should assess the customisations in {subjects}, retire those the standard
      product now covers, and plan upgrades around the remainder.
    severity: Medium

  - id: integration
    area: process_enablement
    headline: Lack of integration between core systems
    implication: >-
      Without integration between core systems, data is re-keyed and reconciled by hand,
      which limits automation and slows reporting across functions.
    impact: [plan_risk, run_cost]
    action: >-
      Target should define integration touchpoints between core systems and establish
      bi-directional interfaces, prioritising the flows that are re-keyed or batched today.
    severity: Medium

  - id: outside_systems
    area: process_enablement
    headline: Incomplete digitisation of business processes
    implication: >-
      Core work runs on spreadsheets, email and manual intervention rather than in systems,
      so headcount scales with volume and controls depend on people.
    impact: [plan_risk, continuity]
    action: >-
      Target should bring the work now run by hand or on spreadsheets — {subjects} — into its
      systems, and standardise the processes and records behind it.
    severity: Medium

  - id: capability_unused
    area: process_enablement
    headline: Licensed system capability not used
    implication: >-
      The business pays for systems whose capability it does not use; the efficiency the
      plan assumes depends on adoption work, not new spend.
    impact: [run_cost, plan_risk]
    action: >-
      Target should assess as-is process adoption and use the capability already licensed
      for {subjects} instead of working around it.
    severity: Medium

  - id: analytics
    area: process_enablement
    headline: Limited analytics tool adoption with decentralised KPI monitoring
    implication: >-
      Without a single source for KPIs, performance is reported inconsistently across
      departments and strategic insight is constrained.
    impact: [plan_risk]
    action: >-
      Target should implement an enterprise-wide analytics capability with a centralised
      source of data to aggregate KPIs and enable unified dashboards.
    severity: Medium

  - id: ai_adoption
    area: ai
    headline: AI adoption limited to embedded tool features
    implication: >-
      AI is used only where vendors have switched it on; no productivity or growth from AI
      is available to the plan without further investment.
    impact: [plan_risk]
    action: >-
      Target should identify AI use cases in its core applications, starting with the
      highest-volume processes, and plan their adoption.
    severity: Low
